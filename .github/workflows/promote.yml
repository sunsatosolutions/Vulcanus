# Site promote (Deploy Flow Standard v1.2)
#
# The DFS core is shared: sunsatosolutions/dfs/.github/workflows/promote.yml.
# This file only says when it runs and which deploy follows.
#
#   automatic          a green CI on main moves staging to that commit ->
#                      webtest-vulcanus.sunsato.com, the gate, rc-YYYY-MM-DD.N.
#                      An older open rc is superseded (webtest shows the newest main).
#   main → staging     the same by hand (Actions > Promote).
#   rc → production    after Yasin approves the rc on webtest: Actions > Promote,
#                      rc_tag + approver. Only Yasin may start it (DFS v1.2).
#                      The rc's package goes live, prod-YYYY-MM-DD.N, IndexNow.
#
# This is the site only. The npm package is released by pushing a v* tag
# (release.yml); a new version reaches the site through the next promotion.
#
# Approver (Vulcanus site, DFS v1.2): Yasin.
name: Promote

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Direction
        type: choice
        options:
          - main → staging
          - rc → production
        required: true
      rc_tag:
        description: "rc → production: the approved rc tag (rc-YYYY-MM-DD.N)"
        required: false
      approver:
        description: "rc → production: who approved"
        required: false
      supersede:
        description: "main → staging: the open rc was rejected or withdrawn, and why"
        required: false

concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    # Automatic only after a green CI of a push to main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    permissions:
      contents: write
    uses: sunsatosolutions/dfs/.github/workflows/promote.yml@v1.2
    with:
      action: ${{ inputs.action || 'main → staging' }}
      sha: ${{ github.event.workflow_run.head_sha }}
      auto: ${{ github.event_name == 'workflow_run' }}
      rc_tag: ${{ inputs.rc_tag }}
      approver: ${{ inputs.approver }}
      supersede: ${{ inputs.supersede }}

  # Each target receives only its own token (DFS-22).
  staging:
    name: Deploy (staging)
    needs: promote
    if: needs.promote.outputs.branch == 'staging'
    # GitHub checks every job of deploy.yml against the caller's grant, including
    # the production job that starts Rollback, so staging grants the same.
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/deploy.yml
    with:
      branch: staging
      sha: ${{ needs.promote.outputs.sha }}
    secrets:
      CLOUDFLARE_API_TOKEN_STAGING: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}

  production:
    name: Deploy (production)
    needs: promote
    if: needs.promote.outputs.branch == 'production'
    permissions:
      contents: write
      # actions: write lets a failed live smoke start Rollback (DFS v1.2).
      actions: write
    uses: ./.github/workflows/deploy.yml
    with:
      branch: production
      sha: ${{ needs.promote.outputs.sha }}
      rc_tag: ${{ inputs.rc_tag }}
      approver: ${{ inputs.approver }}
    secrets:
      CLOUDFLARE_API_TOKEN_PRODUCTION: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}
