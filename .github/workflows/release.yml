name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # npm provenance is signed with the workflow's OIDC identity.
  id-token: write

jobs:
  # The full CI matrix — every OS, every supported Node, coverage, site checks —
  # has to pass on the tagged commit before anything is published.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to npm
    needs: ci
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # A tag that disagrees with package.json would publish the wrong version.
      - name: Verify the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(node scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}")"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes"

      # The registry listing pins one version, so a release that does not
      # re-publish leaves MCP clients discovering an older Vulcanus than the
      # one on npm. server.json is stamped by scripts/release.mjs, and the
      # registry verifies ownership against the package that was just
      # published — so this has to run after the npm publish above.
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # OIDC rather than a token: the workflow's own identity proves it runs in
      # this repository, which is what grants the io.github.sunsatosolutions
      # namespace. Nothing to store, nothing to rotate.
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  # What users actually run is the package on npm, installed globally — so that
  # is what gets tested last, on every OS, rather than the checkout it was built
  # from.
  smoke:
    name: smoke test the published package (${{ matrix.os }})
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Wait for the version to reach the registry
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 30); do
            if [ "$(npm view "@sunsato/vulcanus@$version" version 2>/dev/null)" = "$version" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "@sunsato/vulcanus@$version never appeared on npm" >&2
          exit 1

      - name: Install globally and run it
        env:
          VULCANUS_NO_UPDATE_CHECK: "1"
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm install -g "@sunsato/vulcanus@$version"
          test "$(vulcanus --version)" = "$version"
          vault="$RUNNER_TEMP/smoke-vault"
          vulcanus init "$vault" --name SMOKE --operator Ada --projects "Atlas,Kiln" \
            --defaults --no-import --no-git --yes
          cd "$vault"
          vulcanus doctor
          vulcanus status --json > /dev/null
          grep -q "vulcanus:protocol" AGENTS.md
