name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # npm provenance is signed with the workflow's OIDC identity.
  id-token: write

jobs:
  # The full CI matrix — every OS, every supported Node, coverage, site checks —
  # has to pass on the tagged commit before anything is published.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to npm
    needs: ci
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # A tag that disagrees with package.json would publish the wrong version.
      - name: Verify the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      # Trusted publishing: npm verifies this workflow's OIDC identity against
      # the trusted publisher configured on the package, so no npm token is
      # stored anywhere. It needs npm 11.5.1 or newer.
      - name: Update npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Publish
        run: npm publish --provenance --access public

      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(node scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}")"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes"

  # Everything that needs the version to be visible on npm lives in its own
  # workflow, so it can be re-run for an already-published release without
  # publishing again.
  post-release:
    needs: publish
    uses: ./.github/workflows/post-release.yml
    with:
      tag: ${{ github.ref_name }}
