name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

# Two quick pushes must not race: the older deploy could finish last and
# overwrite the newer site.
concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy to Cloudflare
    runs-on: ubuntu-latest
    environment:
      name: site
      url: https://vulcanus.sunsato.com
    steps:
      - uses: actions/checkout@v7

      # The site is static assets only, so wrangler is the whole build — it is
      # not a project dependency, and the action installs the pinned version.
      - uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.145.0"
          command: deploy
