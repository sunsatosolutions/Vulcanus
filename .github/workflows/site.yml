name: Site

# Weekly drift check of the live site against the release it should be
# serving: the newest prod- release's package. It catches what nobody
# deployed — a dashboard setting, an expiring security.txt, an injected
# header, AI-bot blocking switched on. Deploys and their own smoke tests live
# in deploy.yml.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify the live site
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Static checks
        run: node scripts/site-check.mjs

      - name: Check the live site against the live release
        run: |
          tag=$(git tag -l 'prod-*' | sort -V | tail -1)
          if [ -z "$tag" ]; then
            echo "::notice::No prod- release yet; nothing to compare the live site with."
            exit 0
          fi
          sha=$(git rev-parse "$tag^{commit}")
          mkdir -p dist
          gh release download "$tag" --dir dist --pattern "vulcanus-site-${sha::7}.tar.gz"
          rm -rf out && mkdir out && tar -xzf "dist/vulcanus-site-${sha::7}.tar.gz" -C out
          node scripts/site-live-check.mjs --expect production --sha "$sha"
