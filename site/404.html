<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Vulcanus</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0f1113" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: "Archivo";
        src: url("/fonts/archivo.woff2") format("woff2");
        font-weight: 100 900;
        font-stretch: 62% 125%;
        font-display: swap;
      }
      :root {
        color-scheme: dark;
        --ground: #0f1113;
        --line: #272c31;
        --bone: #e8e3d9;
        --iron: #a3a7ac;
        --ember: #e8572a;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 0 16px;
        background: var(--ground);
        color: var(--bone);
        font-family: "Archivo", ui-sans-serif, system-ui, sans-serif;
      }
      main {
        max-width: 30rem;
      }
      main::before {
        content: "";
        display: block;
        width: 3rem;
        height: 0.35rem;
        border-radius: 2px;
        background: var(--ember);
        margin-bottom: 1.5rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 6vw, 3rem);
        font-stretch: 114%;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      p {
        margin: 0 0 1.75rem;
        color: var(--iron);
        font-size: 1.1rem;
      }
      a {
        color: var(--bone);
        text-decoration-color: var(--line);
        text-underline-offset: 0.22em;
      }
      a:hover {
        text-decoration-color: var(--bone);
      }
      a:focus-visible {
        outline: 2px solid var(--ember);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Nothing forged here</h1>
      <p>This page does not exist.</p>
      <a href="/">Back to Vulcanus</a>
    </main>
  </body>
</html>
